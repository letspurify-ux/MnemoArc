[package]
name = "mnemoarc"
version = "0.1.0"
edition = "2024"
description = "Session-local memory agent for evidence-based source documentation"
license = "MIT"
autotests = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
caseless = "0.2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.55", default-features = false }
dotenvy = "0.15"
futures-util = "0.3"
globset = "0.4"
mime_guess = "2"
ignore = "0.4"
merman-core = "0.6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tiktoken-rs = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
unicode-normalization = "0.1"

axum = "0.8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower-http = { version = "0.6", features = ["fs"] }
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"
oracle = "0.6.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# Integration tests: see tests/suite.rs for why most files share one binary.
[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "concurrent_writes"
path = "tests/concurrent_writes.rs"

[[test]]
name = "config_environment"
path = "tests/config_environment.rs"

[[test]]
name = "live_checkpoint"
path = "tests/live_checkpoint.rs"

[[test]]
name = "live_documentation"
path = "tests/live_documentation.rs"

[[test]]
name = "live_message_recovery"
path = "tests/live_message_recovery.rs"

[[test]]
name = "proxy"
path = "tests/proxy.rs"

[[test]]
name = "robustness"
path = "tests/robustness.rs"

[[test]]
name = "web_launcher"
path = "tests/web_launcher.rs"

# Dependencies (tiktoken, serde_json, tree-sitter, regex) do the per-round
# work of agent scenario tests; unoptimized they made those tests 7-8x slower.
# This crate stays unoptimized, so incremental rebuilds keep their speed.
[profile.dev.package."*"]
opt-level = 2

# Line tables keep file:line in test panics while shrinking each test binary,
# which shortens linking and the first-run scan of every rebuilt binary.
[profile.test]
debug = "line-tables-only"
