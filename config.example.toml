base_url = "https://openrouter.ai/api/v1"
# OpenRouter model ID. Set its documented combined context limit below.
model = "nvidia/nemotron-3-ultra-550b-a55b:free"
model_context = 1000000
# proxy = "http://localhost:8080"
# Takes precedence over proxy and disables environment/system proxy detection.
disable_proxy = false
reasoning_effort = "low"
# Thinking/reasoning toggle. false maps to reasoning_effort = "none".
enable_thinking = true
api_key_env = "OPENAI_API_KEY"
context_tokens = 230000
output_tokens = 32000
legacy_max_tokens = false
stream_usage = true
memory_count = 1000
recent_count = 20
related_count = 5
memory_reuse = true
memory_body_bytes = 32768
memory_bytes = 33554432
history_bytes = 67108864
state_tokens = 2000
index_tokens = 4000
# Tool result budgets. Left unset, one result is context_tokens / 32 and one
# response's results together context_tokens / 16 (7,187 and 14,375 at
# 230,000). Set a number to fix either; the fixed 4,000 / 8,000 suit 64K.
# result_tokens = 4000
# batch_tokens = 8000
checkpoint_tokens = 4000
high_water = 0.9
low_water = 0.5
read_parallelism = 4
# App-wide limit (1..32). Lowering it does not cancel existing runs.
max_concurrent_sessions = 4
# Seconds to wait for response headers and for each silent gap in the stream;
# a long answer that keeps streaming is not cut off. Timeouts are retried.
request_timeout_secs = 600
tool_timeout_secs = 30
retries = 2
run_timeout_secs = 7200
run_tokens = 20000000
# Budget fractions: prioritize drafting, then verification, then close out the
# document with unresolved items reported (0 < closing < verification < writing).
writing_reserve_ratio = 0.5
verification_reserve_ratio = 0.25
closing_reserve_ratio = 0.1
repeated_read_limit = 2
stall_round_limit = 8
projects = []

# Idle-time document improvement stays off until enabled. Each project opts in
# with auto_improve = true and may set its own auto_prompt (empty uses prompt).
[automation]
enabled = false
prompt = "결과 문서를 현재 소스와 대조해 틀리거나 오래된 내용을 고치고, 빠진 중요한 내용을 근거와 함께 보완하세요. 바뀐 내용이 없으면 문서를 수정하지 마세요."
idle_minutes = 30
stale_days = 7
max_runs_per_day = 3

# DB access remains off until you explicitly enable both switches.
# Put the password in the named environment variable or .env, not here.
[database]
enabled = false
# Each free execution mode needs its own explicit opt-in.
raw_query_enabled = false
raw_statement_enabled = false
procedure_enabled = false
function_enabled = false
host = "localhost"
port = 1521
service = "FREEPDB1"
username = "READ_ONLY_USER"
password_env = "MNEMOARC_DB_PASSWORD"
max_rows = 100

[[database.queries]]
id = "employee_by_department"
description = "Find employee IDs and names in a department"
sql = "SELECT employee_id, first_name FROM employees WHERE department_id = :dept_id"
enabled = false
params = [{ name = "dept_id", description = "Department ID to look up" }]
