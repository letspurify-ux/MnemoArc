base_url = "https://openrouter.ai/api/v1"
# OpenRouter model ID. Set its documented combined context limit below.
model = "qwen/qwen3.8-27b"
model_context = 1000000
# proxy = "http://localhost:8080"
# Takes precedence over proxy and disables environment/system proxy detection.
disable_proxy = false
# reasoning_effort = "xhigh"
# Qwen thinking/reasoning toggle. false maps to reasoning_effort = "none".
enable_thinking = true
api_key_env = "OPENROUTER_API_KEY"
context_tokens = 64000
output_tokens = 8000
legacy_max_tokens = false
stream_usage = true
memory_count = 1000
recent_count = 20
related_count = 5
memory_reuse = true
memory_body_bytes = 8192
memory_bytes = 16777216
history_bytes = 67108864
state_tokens = 2000
index_tokens = 4000
result_tokens = 4000
batch_tokens = 8000
checkpoint_tokens = 4000
high_water = 0.8
low_water = 0.6
read_parallelism = 4
request_timeout_secs = 180
tool_timeout_secs = 30
retries = 2
run_timeout_secs = 1800
run_tokens = 500000
review_limit = 3
# Document edit requests after each failed review (reads/checks excluded); increase to resume.
document_repair_limit = 8
# One bounded same-model revision for source answers; incurs an extra request.
source_answer_review = true
# Source-document review: read-only same-model pass, up to two attempts per task.
source_document_review = true
projects = []

# DB access remains off until you explicitly enable both switches.
# Put the password in the named environment variable or .env, not here.
[database]
enabled = false
# Each free execution mode needs its own explicit opt-in.
raw_query_enabled = false
raw_statement_enabled = false
procedure_enabled = false
function_enabled = false
host = "localhost"
port = 1521
service = "FREEPDB1"
username = "READ_ONLY_USER"
password_env = "MNEMOARC_DB_PASSWORD"
max_rows = 100

[[database.queries]]
id = "employee_by_department"
description = "Find employee IDs and names in a department"
sql = "SELECT employee_id, first_name FROM employees WHERE department_id = :dept_id"
enabled = false
params = [{ name = "dept_id", description = "Department ID to look up" }]
